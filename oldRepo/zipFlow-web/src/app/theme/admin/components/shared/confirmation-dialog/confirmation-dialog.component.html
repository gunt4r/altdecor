<div class="card">
  <div class="modal-header card-title">
    <h4 class="modal-title main-color">{{ title }}</h4>

    <button type="button" class="close" aria-label="Close" (click)="dismiss()">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>

  <div class="modal-body">
    {{ message }}
  </div>

  <div class="modal-footer">
    <button type="button" class="btn action-btn btn-outlined-gray" (click)="decline()">{{ btnCancelText }}</button>
    <button type="button" class="btn btn-primary action-btn" (click)="accept()">{{ btnOkText }}</button>
  </div>
</div>
