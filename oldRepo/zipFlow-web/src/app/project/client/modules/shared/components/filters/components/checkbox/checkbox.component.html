<div class="checkbox" *ngIf="filter">
  <div class="checkbox__label">{{ filter.label | translate }}</div>

  <div class="checkbox__buttons">
    <div class="button" *ngFor="let button of filter.options"
         [ngClass]="{ active: isActiveOption(button) }" (click)="setValue(button)">
      {{ button | translate }}
    </div>
  </div>
</div>
