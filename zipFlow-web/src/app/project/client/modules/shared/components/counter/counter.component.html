<div class="counter">
  <div class="counter__action" (click)="decrement()">
    <img src="assets/images/content/decrease.svg" alt="decrease">
  </div>

  <div class="counter__value"> {{ count }} </div>

  <div class="counter__action" (click)="increment()">
    <img src="assets/images/content/increase.svg" alt="increase">
  </div>
</div>
