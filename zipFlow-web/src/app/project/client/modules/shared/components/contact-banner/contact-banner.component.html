<div class="contact">
  <img class="contact__image" src="assets/images/content/contact.svg" alt="">

  <div class="contact__content">
    <div class="contact__title">{{ 'Contact.Title' | translate }}</div>
    <div class="contact__subtitle">{{ 'Contact.Subtitle' | translate }}</div>
  </div>

  <button class="default contact__button"><a [href]="'tel:' + contactPhone.main_phone">{{ 'Contact.Button.Contact' | translate }}</a></button>
</div>
