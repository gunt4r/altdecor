<div class="offer" *ngIf="offers">
  <div class="offer__left" [ngStyle]="{margin: margin}">
    <div class="offer__slider">
      <ngx-slick-carousel class="offer__container"
                          #slickModal="slick-carousel"
                          (afterChange)="afterChange($event)"
                          (beforeChange)="beforeChange($event)"
                          [config]="slideConfig">
        <ng-container ngxSlickItem *ngFor="let offer of offers">
          <div class="offer__content">
            <div class="offer__state">{{offer.availability | translate | uppercase}}</div>
            <div class="offer__title">{{offer.title | translate}}</div>
            <div class="offer__description">{{offer.description | translate}}</div>
            <div class="offer__details" *ngIf="offer.product">
              <div class="left">
                <div class="image" [style.background-image]="'url(' + offer.product.img +')'" *ngIf="offer.product.img"></div>
                <div class="content">
                  <div class="title">{{offer.product.category | translate}}</div>
                  <div class="subtitle">{{offer.product.name | translate}}</div>
                </div>
              </div>
              <div class="price">{{offer.product.price | translate | uppercase}}</div>
            </div>
          </div>
        </ng-container>
      </ngx-slick-carousel>

      <div class="actions">
        <div class="actions__arrows">
          <svg class="prev" [ngClass]="{'active': !isFirstSlide}" (click)="prev()" width="25" height="8" viewBox="0 0 25 8" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path fill="currentColor" d="M0.646446 3.64645C0.451185 3.84171 0.451185 4.15829 0.646446 4.35355L3.82843 7.53553C4.02369 7.7308 4.34027 7.7308 4.53553 7.53553C4.7308 7.34027 4.7308 7.02369 4.53553 6.82843L1.70711 4L4.53553 1.17157C4.7308 0.976311 4.7308 0.659728 4.53553 0.464466C4.34027 0.269204 4.02369 0.269204 3.82843 0.464466L0.646446 3.64645ZM25 3.5L1 3.5V4.5L25 4.5V3.5Z"/>
          </svg>

          <svg class="next" [ngClass]="{'active': !isLastSlide}" (click)="next()" width="38" height="8" viewBox="0 0 38 8" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path fill="currentColor" d="M37.3536 4.35355C37.5488 4.15829 37.5488 3.84171 37.3536 3.64645L34.1716 0.464466C33.9763 0.269204 33.6597 0.269204 33.4645 0.464466C33.2692 0.659728 33.2692 0.976311 33.4645 1.17157L36.2929 4L33.4645 6.82843C33.2692 7.02369 33.2692 7.34027 33.4645 7.53553C33.6597 7.7308 33.9763 7.7308 34.1716 7.53553L37.3536 4.35355ZM0 4.5H37V3.5H0V4.5Z"/>
          </svg>
        </div>
      </div>
    </div>
  </div>
  <div class="overlay"></div>
  <div class="offer__bg" [ngClass]="{'animate': startAnimation}" [style.background-image]="'url(' + offers[currentSlideIndex]?.img +')'"></div>
</div>
