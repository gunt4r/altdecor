<div class="filters">
  <button class="default"
          (click)="toggleSideFilter()"
          *ngIf="isMobile && showMobileTrigger">
    {{'MobileFilterButton' | translate}}
  </button>
  <div *ngIf="!isMobile; else mobileFilter">
    <div class="filters__heading">{{ 'Filters.Title' | translate }}</div>
    <div [formGroup]="form">
      <div class="filter" *ngFor="let filter of filters; trackBy: trackByDbKey">
        <ng-container [ngSwitch]="filter.filter_type" *ngIf="form.controls[filter.db_key]">
          <ng-container *ngSwitchCase="filterType.Dropdown">
            <app-dropdown [filter]="filter"
                          [formControlName]="filter.db_key"
                          [singleSelection]="false"
                          (valueChanged)="submit()"></app-dropdown>
          </ng-container>

          <ng-container *ngSwitchCase="filterType.Checkbox">
            <app-checkbox [filter]="filter" [formControlName]="filter.db_key" (valueChanged)="submit()"></app-checkbox>
          </ng-container>

          <ng-container *ngSwitchCase="filterType.Radio">
            <app-radio [filter]="filter" [formControlName]="filter.db_key" (valueChanged)="submit()"></app-radio>
          </ng-container>

          <ng-container *ngSwitchDefault>
            <app-single-filter [filter]="filter" [formControlName]="filter.db_key" (valueChanged)="submit()"></app-single-filter>
          </ng-container>
        </ng-container>
      </div>
    </div>
  </div>
</div>

<ng-template #mobileFilter>
  <div class="filter-container" [class.sidenav-open]="isSideFilterOpen" (click)="toggleSideFilter()">
    <div class="filter-sidenav" (click)="$event.stopPropagation()">
      <div class="filter-sidenav__header">
        <span class="filter-sidenav__title">{{ 'Filters.Title' | translate }}</span>
        <button class="filter-sidenav__close" type="button" (click)="toggleSideFilter()" aria-label="Close filters">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <line x1="6" y1="6" x2="18" y2="18"></line>
            <line x1="18" y1="6" x2="6" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="filter-sidenav__chips" *ngIf="activeChips.length">
        <button class="filter-chip" *ngFor="let chip of activeChips" type="button" (click)="chipRemove.emit(chip)">
          <span class="filter-chip__label">{{ chip.label }}</span>
          <svg class="filter-chip__x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <line x1="6" y1="6" x2="18" y2="18"></line>
            <line x1="18" y1="6" x2="6" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="filter-content">
        <div [formGroup]="form">
          <div class="filter" *ngFor="let filter of filters; trackBy: trackByDbKey">
            <ng-container [ngSwitch]="filter.filter_type">
              <ng-container *ngSwitchCase="filterType.Dropdown">
                <app-dropdown [filter]="filter" [formControlName]="filter.db_key" (valueChanged)="submit()"></app-dropdown>
              </ng-container>

              <ng-container *ngSwitchCase="filterType.Checkbox">
                <app-checkbox [filter]="filter" [formControlName]="filter.db_key" (valueChanged)="submit()"></app-checkbox>
              </ng-container>

              <ng-container *ngSwitchCase="filterType.Radio">
                <app-radio [filter]="filter" [formControlName]="filter.db_key" (valueChanged)="submit()"></app-radio>
              </ng-container>

              <ng-container *ngSwitchDefault>
                <app-single-filter [filter]="filter" [formControlName]="filter.db_key" (valueChanged)="submit()"></app-single-filter>
              </ng-container>
            </ng-container>
          </div>
        </div>
      </div>
    </div>
  </div>
</ng-template>
