<footer class="page-footer">
  <div class="footer-inner">
    <!-- Brand -->
    <div class="footer-brand">
      <a class="footer-logo" routerLink="/">
        <img src="assets/images/content/logo-white.png" alt="Altdecor">
      </a>
      <p class="footer-description">{{ t(description) }}</p>
      <div class="footer-socials">
        <a class="social-link" *ngFor="let key of socialMediaKeys"
           (click)="navigate(data.SOCIAL_MEDIA[key]['LINK'])">
          <img [src]="data.SOCIAL_MEDIA[key]['IMG']" [alt]="data.SOCIAL_MEDIA[key]['ALT']">
        </a>
      </div>
    </div>

    <!-- Magazine / showrooms -->
    <div class="footer-column">
      <h3>{{ t(columnTitles.magazine) }}</h3>
      <div class="footer-showrooms">
        <div class="footer-showroom" *ngFor="let s of showrooms">
          <div class="footer-showroom__name" *ngIf="s.name">{{ s.name }}</div>
          <div class="footer-showroom__address" *ngIf="s.address">{{ s.address }}</div>
        </div>
      </div>
    </div>

    <!-- Produse -->
    <div class="footer-column">
      <h3>{{ t(columnTitles.produse) }}</h3>
      <a class="footer-link" *ngFor="let l of produseLinks" (click)="navigate(l.link)">{{ t(l.label) }}</a>
    </div>

    <!-- Informatii -->
    <div class="footer-column">
      <h3>{{ t(columnTitles.info) }}</h3>
      <a class="footer-link" *ngFor="let l of infoLinks" (click)="navigate(l.link)">{{ t(l.label) }}</a>
    </div>
  </div>

  <div class="footer-bottom">
    <p class="copyright-text">© {{ currentYear }} <a routerLink="/">Gardecor</a>. {{ t(rightsText) }}</p>
    <div class="footer-legal-links">
      <a *ngFor="let l of legalLinks" (click)="navigate(l.link)">{{ t(l.label) }}</a>
    </div>
  </div>
</footer>
