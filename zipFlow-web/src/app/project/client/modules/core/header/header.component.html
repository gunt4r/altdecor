<app-cart [(isCartOpen)]="isCartOpen"></app-cart>

<div class="page-header">
  <div class="header-main-bar">
    <div class="header-logo">
      <a (click)="goToHome()"><img src="assets/images/content/logo.png"></a>
    </div>

    <div class="header-user-utilities">
      <button *ngIf="isMobile && sizeChecked"
              class="utility-btn mobile-menu-toggle"
              type="button"
              (click)="toggleMobileNav()"
              aria-label="Open menu">
        <img src="assets/images/content/menu-icon.svg" alt="Menu icon" />
      </button>

      <button class="utility-btn" type="button" aria-label="Search">
        <img src="assets/images/content/search-icon.svg" alt="Search icon" />
      </button>
      <button class="utility-btn cart-button" (click)="toggleOpenCart()" aria-label="Cart">
        <img src="assets/images/content/cart-icon.svg" alt="Cart icon">
        <span class="cart-badge" *ngIf="cartCount">{{cartCount}}</span>
      </button>

      <div *ngIf="!isMobile && sizeChecked" class="language-dropdown" [class.open]="isLanguageDropdownOpen">
        <button class="language-dropdown__trigger" (click)="toggleLanguageDropdown($event)">
          {{selectedLanguage}}
          <svg xmlns="http://www.w3.org/2000/svg" width="10" height="6" viewBox="0 0 10 6" fill="none">
            <path d="M5 6L0 0H10L5 6Z" fill="currentColor"/>
          </svg>
        </button>
        <div class="language-dropdown__menu" *ngIf="isLanguageDropdownOpen">
          <button class="language-dropdown__option"
                  *ngFor="let language of languages"
                  [class.active]="selectedLanguage === language"
                  (click)="selectLanguage(language, $event)">
            {{language}}
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="header-nav-bar" *ngIf="!isMobile && sizeChecked">
    <button class="nav-item nav-item--catalog" [class.active]="menuOpened"
            (mouseenter)="onNavMouseEnter()"
            (mouseleave)="onNavMouseLeave()"
            (click)="toggleMenuOpened(!menuOpened)">
      Catalog
      <svg xmlns="http://www.w3.org/2000/svg" width="10" height="6" viewBox="0 0 10 6" fill="none">
        <path d="M5 6L0 0H10L5 6Z" fill="currentColor"/>
      </svg>
    </button>

        <button class="nav-item" *ngFor="let link of topNavLinks"
          [class.active]="isTopNavLinkActive(link)"
          (click)="handleTopNavClick(link)">
      {{ link.label }}
    </button>

        <div class="nav-item nav-item--more" *ngIf="overflowNavLinks.length"
             (mouseenter)="toggleMoreMenu(true)"
             (mouseleave)="toggleMoreMenu(false)">
          <button class="nav-item nav-more__trigger" [class.active]="moreMenuOpen"
                  (click)="toggleMoreMenu()">
            {{ 'Header.More' | translate }}
            <svg xmlns="http://www.w3.org/2000/svg" width="10" height="6" viewBox="0 0 10 6" fill="none">
              <path d="M5 6L0 0H10L5 6Z" fill="currentColor"/>
            </svg>
          </button>
          <div class="nav-more__dropdown" *ngIf="moreMenuOpen">
            <button class="nav-more__item" *ngFor="let link of overflowNavLinks"
                    [class.active]="isTopNavLinkActive(link)"
                    (click)="handleTopNavClick(link)">
              {{ link.label }}
            </button>
          </div>
        </div>

        <button class="nav-item" *ngFor="let link of staticNavLinks"
          [class.active]="isActiveNav(link.path)"
          (click)="goToNavLink(link)">
          {{ link.label }}
        </button>
  </div>

  <div class="mobile-nav-backdrop" [class.visible]="isMobileNavOpen" (click)="toggleMobileNav(false)"></div>

  <aside class="mobile-nav" [class.open]="isMobileNavOpen">
    <div class="mobile-nav__head">
      <a class="mobile-nav__logo" (click)="goToHome()">
        <img src="assets/images/content/logo-white.png" alt="Altdecor" />
      </a>
      <button type="button" class="mobile-nav__close" aria-label="Close menu" (click)="toggleMobileNav(false)">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <div class="mobile-nav__links">
      <div class="mobile-nav__section">
        <div class="mobile-nav-expandable" *ngFor="let productType of productsMenuData; let j = index"
             [style.animation-delay]="isMobileNavOpen ? (j * 28) + 'ms' : '0ms'"
             [class.fade-row]="isMobileNavOpen">
          <button class="mobile-nav-link mobile-nav-link--expandable" type="button"
                  [class.expanded]="expandedMobileType === productType.type.id"
                  (click)="toggleMobileType(productType.type.id)">
            {{ getLocalizedLabel(productType.type?.label) }}
            <svg class="chevron-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"/>
            </svg>
          </button>

          <div class="mobile-nav-subcategories" *ngIf="expandedMobileType === productType.type.id">
            <button type="button"
                    class="mobile-nav-subcategory"
                    *ngFor="let category of $any(productType.categories)"
                    (click)="goToCategoryMobile($any(category))">
              {{ getLocalizedLabel($any(category).label) }}
            </button>
          </div>
        </div>
      </div>

      <div class="mobile-nav__divider"></div>

      <div class="mobile-nav__section">
        <button class="mobile-nav-link" type="button" *ngFor="let link of staticNavLinks; let k = index"
                [style.animation-delay]="isMobileNavOpen ? ((productsMenuData.length + k) * 28) + 'ms' : '0ms'"
                [class.fade-row]="isMobileNavOpen"
                (click)="goToNavLink(link)">
          {{ link.label }}
        </button>
      </div>

      <div class="mobile-nav__divider"></div>

      <div class="mobile-nav__section">
        <button class="mobile-nav-link mobile-nav-link--action" type="button"
                (click)="downloadPdf(generalDetails.catalog)">
          {{ data.QUICK_MENU['CATALOG'] | translate }}
        </button>
      </div>
    </div>

    <div class="mobile-nav__footer" *ngIf="isMobile && sizeChecked">
      <button class="mobile-lang-btn"
              [class.active]="selectedLanguage === language"
              (click)="switchLanguage(language)"
              *ngFor="let language of languages">
        {{language}}
      </button>
    </div>
  </aside>

  <div class="product-menu"
      (mouseenter)="onNavMouseEnter()"
      (mouseleave)="onNavMouseLeave()"
       *ngIf="menuOpened && !isMobile">
    <div class="main-panel">
      <div class="product-main-type" *ngFor="let productType of productsMenuData">
        <div class="type-label" [ngClass]="{active: productType.type.active}"
             (mouseover)="setActiveType(productType.type.id)">
          {{ getLocalizedLabel(productType.type.label) }}
          <svg xmlns="http://www.w3.org/2000/svg" width="8" height="4" viewBox="0 0 8 4" fill="none">
            <path d="M4.06673 3.9801L0.733398 0.646729L7.40007 0.646728L4.06673 3.9801Z" fill="#1B1B1B"/>
          </svg>
        </div>

        <ng-container *ngIf="productType.type.active">
          <div class="type-categories" *ngFor="let category of productType.categories">
            <div class="type-category" [ngClass]="{active: category.id === activeCategoryId}"
                (click)="goToCategory(category.url, category.label)"
                 (mouseover)="setActiveCategory(category.id, category.products)">
              {{ getLocalizedLabel(category.label) }}
            </div>
          </div>
        </ng-container>
      </div>

      <div class="product-main-type">
        <div class="type-label active" (click)="downloadPdf(generalDetails.catalog)">
          {{ data.QUICK_MENU['CATALOG'] | translate }}
        </div>
      </div>

      <div class="product-main-type">
        <a class="link-item type-label active" (click)="goToNavLink({ path: data.MENU['CONTACTS']['LINK'] || '/contacts' })">
          {{ data.MENU['CONTACTS']['LABEL'] | translate }}
        </a>
      </div>

      <div *ngIf="isMobile && sizeChecked" class="language-switch mobile-language-switch">
        <button class="language-switch-button language-switch-margin"
                [ngClass]="{ 'selected-language': selectedLanguage === language }"
                (click)="switchLanguage(language)"
                *ngFor="let language of languages">
          {{language}}
        </button>
      </div>
    </div>

    <div class="product-preview">
      <div class="preview-card"
              *ngFor="let product of showProducts | slice:0:2"
              (click)="goToNavLink({ path: '/products/' + product.id })">
        <div class="preview-image" [style.background-image]="'url(' + product.image + ')'">
          <span class="preview-badge">-20%</span>
        </div>
        <div class="preview-content">
          <h4>{{ getLocalizedLabel(product.title) }}</h4>
          <button class="preview-add" type="button">Adaugă</button>
        </div>
      </div>
    </div>
  </div>

</div>
