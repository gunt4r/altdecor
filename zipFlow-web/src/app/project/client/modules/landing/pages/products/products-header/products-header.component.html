<div class="products-header">
  <div class="products-header__title">
    {{ 'Products.Categories' | translate }}
  </div>
  <div class="products-header__products">
    <div class="products-header__sort">
      <span class="products-header__label">{{ 'Products.Label.Sort' | translate }}</span>
      <app-select [selectedOption]="sortBy" [options]="sorts" [type]="selectType.Default" (optionSelected)="sort($event)"></app-select>
    </div>

    <div class="products-header__amount">
      <span class="amount--label">{{ 'Products.Label.Products' | translate }}</span>
      <span class="amount--value">{{ total }}</span>
    </div>
  </div>
</div>
