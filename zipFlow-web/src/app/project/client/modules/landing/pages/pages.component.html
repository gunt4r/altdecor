<div class="page" [ngClass]="{ inactive: activeDialog }">
  <app-header (active)="active($event)" [activeDialog]="activeDialog"></app-header>

  <div class="dialog" *ngIf="activeDialog">
    <app-shop (onClose)="active(false)"></app-shop>
  </div>

  <div class="app-container">
    <router-outlet></router-outlet>
  </div>

  <app-footer></app-footer>
</div>
