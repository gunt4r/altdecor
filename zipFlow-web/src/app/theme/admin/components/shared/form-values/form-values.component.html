<div class="form-values">
  <ng-container *ngFor="let keyValuePair of objectKeys(data)">
    <div *ngIf="!excludeKeys.includes(keyValuePair.key)">
      <label>{{ keyValuePair.key | titlecase }}</label>
      <div class="inner-group" *ngIf="isObject(keyValuePair.value)">
        <app-form-values [data]="keyValuePair.value"></app-form-values>
      </div>
      <div class="value" *ngIf="!isObject(keyValuePair.value)">{{ keyValuePair.value || '-' }}</div>
    </div>
  </ng-container>
</div>
