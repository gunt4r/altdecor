<nav class="navbar navbar-expand-lg navbar-absolute">
  <div class="container-fluid px-lg">
    <div class=" navbar-wrapper">
      <a class=" navbar-logo" [routerLink]="['/']"><img src="app/theme/admin/assets/icons/logo.png"></a>

      <div class="admin-search">
        <svg class="admin-search__icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
        </svg>
        <input #adminSearch class="admin-search__input" type="text"
               [value]="searchTerm"
               (input)="onSearch(adminSearch.value)"
               (keydown.escape)="adminSearch.value=''; clearSearch()"
               placeholder="Search..." />
        <button class="admin-search__clear" type="button" *ngIf="searchTerm"
                (click)="adminSearch.value=''; clearSearch()" aria-label="Clear search">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="navbar-collapse" [ngbCollapse]="isCollapsed">
      <ul class="navbar-nav ml-auto">
        <li class="nav-item" ngbDropdown>
          <a
            class="nav-link dropdown-toggle pr-0"
            data-toggle="dropdown"
            ngbDropdownToggle
          >
            <div class="d-flex" *ngIf="user">
              <div class="name-container text-right">
                <div>{{user['email']}}</div>
              </div>
            </div>
          </a>
          <ul class="dropdown-navbar" ngbDropdownMenu *ngIf="navItems.length">
            <li class=" nav-link" *ngFor="let item of navItems">
              <a ngbDropdownItem [routerLink]="[item.url]" class=" nav-item">{{item.name}}</a>
            </li>
          </ul>
        </li>
        <li class=" separator d-lg-none"></li>
      </ul>
    </div>
    <div class="navbar-utilities">
      <button class="navbar-logout" (click)="logout()"><img src="app/theme/admin/assets/icons/logout.svg"></button>
    </div>
  </div>
</nav>
