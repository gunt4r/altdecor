events {}

http {
    # Define CORS Origin Map
    map $http_origin $cors_origin {
        default "*";
        "https://altdecor.md" "https://altdecor.md";
    }

    include /etc/nginx/mime.types;

    # Disable caching globally (if needed)
    proxy_cache off;

    # Define a shared memory zone to track number of connections per IP address
    #limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;
    # Define a zone to track requests from each IP
    #limit_req_zone $binary_remote_addr zone=req_limit_per_ip:10m rate=10r/s;

    server {
        listen 443 ssl;
        server_name _;

        # Closing slow connections
        # client_body_timeout 5s;
        # client_header_timeout 5s;

        # Limit the number of requests and connections per IP address
        # limit_req zone=req_limit_per_ip burst=20;
        # limit_conn conn_limit_per_ip 20;

        # Deny requests with large request bodies to mitigate against some types of attacks
        # client_body_buffer_size 1k;
        # client_header_buffer_size 1k;
        client_max_body_size 1000M;
        # large_client_header_buffers 2 1k;

        # SSL/TLS settings
        ssl_certificate /etc/letsencrypt/live/altdecor.md/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/altdecor.md/privkey.pem;
        # ssl_protocols TLSv1.2 TLSv1.3;
        # ssl_prefer_server_ciphers on;
        # ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        # ssl_session_cache shared:SSL:10m;
        # ssl_session_timeout 10m;
        # ssl_stapling on;
        # ssl_stapling_verify on;
        # resolver 8.8.8.8;

        # Define a location block for API requests
        location /api/ {
            proxy_pass http://altdecor-server:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Disable all caching
            proxy_cache off;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            add_header Expires 0 always;

            # Disable ETag headers
            etag off;

            # CORS headers
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
            add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Authorization' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;

            # Handle OPTIONS for preflight requests
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH';
                add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Authorization';
                add_header 'Access-Control-Allow-Credentials' 'true';
                add_header 'Content-Length' 0;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                return 204;
            }
        }

        location / {
            root /usr/share/nginx/html;  # Path to the dist folder inside the container

            index index.html;

            try_files $uri $uri/ /index.html;

            # Add CORS headers for all responses
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
            add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Authorization' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;

            # Cache control headers to disable caching
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires 0 always;

            # Handle OPTIONS method for CORS pre-flight requests
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH';
                add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Authorization';
                add_header 'Access-Control-Allow-Credentials' 'true';
                add_header 'Content-Length' 0;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                return 204;
            }
        }

        location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webmanifest|mp4|webm|avif|ogg|pdf|txt)$ {
            root /usr/share/nginx/html; # Path to Angular's browser build
            expires 1y; # Cache static files for one year
            add_header Cache-Control "public";
        }
    }

    # Port 80 handling with Let's Encrypt validation routing
    server {
        listen 80;
        server_name altdecor.md www.altdecor.md api.altdecor.md;

        # 1. Catch Let's Encrypt renewal requests first
        location /.well-known/acme-challenge/ {
            root /usr/share/nginx/certbot;
        }

        # 2. Redirect everything else to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }
}
