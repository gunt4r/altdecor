services:
  altdecor-client-dev:
    container_name: altdecor-client-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - .env
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      - /app/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4200:4200"
    command: >
      npm run start:dev --
      --host 0.0.0.0
      --port 4200
    stdin_open: true
    tty: true
    restart: unless-stopped
